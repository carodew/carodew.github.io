<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>{% if page["page-title"] %}{{ page["page-title"] }}{% else %}{{ site.title }}{% endif %}</title>
	<meta name="author" content="Carolyn Dew">
	<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

	<!-- Typekit goes before CSS to prevent FOUT -->
	<script src="https://use.typekit.net/mik1jeq.js"></script>
	<script>
		try {
			Typekit.load();
		} catch(e) {
		}
	</script>

	<link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}">

	{% comment %}
	  rel="canonical" not needed. GitHub Pages 301s every alternate address to one canonical URL -
	  carodew.github.io to the custom domain.
	{% endcomment %}

	<link rel="icon" type="image/x-icon" href="{{ "/favicon.ico" | relative_url }}">
	<link rel="icon" type="image/png" href="{{ "/favicon.png" | relative_url }}">

	<meta name="google-site-verification" content="9wlTb9DnTuK3Z83Sj_-tU9ArrhuuhX9D6C3ytscU34M" />
</head>
